{% extends 'base.html' %}

{% block title %}プロジェクト編集{% endblock %}

{% block content %}
    <h1>記録の修正</h1>
    <h3 class="text-muted mb-3">現在のプロジェクト収支: {{ total_balance }} 万ゴールド</h3>
    <p>プロジェクト: <strong>{{ record.project.name }}</strong></p>

    <form method="post" class="mt-4">
        {% csrf_token %}
        <div class="mb-3">
            <label for="{{ form.name.id_for_label }}" class="form-label">{{ form.name.label }}</label>
            {{ form.name }}
        </div>
        <button type="submit" class="btn btn-primary">更新</button>
        <a href="{% url 'records:project_detail' project.pk %}" class="btn btn-secondary">キャンセル</a>
    </form>
{% endblock %}
