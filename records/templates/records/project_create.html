{% extends 'base.html' %}

{% block title %}新規プロジェクト作成{% endblock %}

{% block content %}
    <h1>新規プロジェクト作成</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" class="mt-4">
        {% csrf_token %}
        <div class="mb-3">
            <label for="{{ form.name.id_for_label }}" class="form-label">{{ form.name.label }}</label>
            {{ form.name }}
        </div>
        <button type="submit" class="btn btn-primary">作成</button>
        <a href="{% url 'records:project_list' %}" class="btn btn-secondary">一覧に戻る</a>
    </form>
{% endblock %}
