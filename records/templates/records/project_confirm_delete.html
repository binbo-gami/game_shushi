{% extends 'base.html' %}

{% block title %}プロジェクト削除の確認{% endblock %}

{% block content %}
    <h1>プロジェクト削除の確認</h1>
    <div class="alert alert-danger mt-3">
        <h4 class="alert-heading">警告</h4>
        <p>本当に「<strong>{{ project.name }}</strong>」を削除しますか？</p>
        <hr>
        <p class="mb-0">この操作は元に戻せません。プロジェクト内のすべての収支記録も一緒に削除されます。</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">はい、削除します</button>
        <a href="{% url 'records:project_detail' project.pk %}" class="btn btn-secondary">キャンセル</a>
    </form>
{% endblock %}
