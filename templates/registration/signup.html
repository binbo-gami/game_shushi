<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>アカウント作成</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f5f5f5;
        }
        .form-signup {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            margin: auto;
        }
    </style>
</head>
<body class="text-center">
    
    <main class="form-signup">
        <form method="post">
            <h1 class="h3 mb-3 fw-normal">アカウントを作成</h1>
            {% csrf_token %}
            {{ form.as_p }}
            <button class="w-100 btn btn-lg btn-primary mt-3" type="submit">登録する</button>
            <p class="mt-3">
                <a href="{% url 'login' %}">既にアカウントをお持ちですか？ ログイン</a>
            </p>
            <p class="mt-5 mb-3 text-muted">&copy; {% now "Y" %} 収支管理アプリ</p>
        </form>
    </main>

</body>
</html>
