<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>アカウント作成</title>
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #f5f5f5; }
        .form-signup { width: 100%; max-width: 400px; padding: 15px; margin: auto; }
    </style>
</head>
<body class="text-center">
    <main class="form-signup">
        <form method="post">
            <h1 class="h3 mb-3 fw-normal">アカウントを作成</h1>
            {% csrf_token %}
            {{ form.as_p }}
            <button class="w-100 btn btn-lg btn-primary mt-3" type="submit">登録する</button>
            <p class="mt-3"><a href="{% url 'login' %}">既にアカウントをお持ちですか？ ログイン</a></p>
            <footer class="mt-5 text-muted">
                <p><a href="https://note.com/milie_usotsuki/n/ndef4302cdd01" target="_blank" rel="noopener noreferrer" class="text-decoration-none">使い方はこちら</a></p>
                <p class="mb-0"><strong>Version: 1.2.0</strong></p>
                <p class="mb-0"><a href="https://note.com/milie_usotsuki/n/n8e1f586c096a" target="_blank" rel="noopener noreferrer">バージョンアップ情報はこちら</a></p>
                <p class="mt-3 mb-3">&copy; {% now "Y" %} 収支管理支援ツール byみらい(@milie_usotsuki)</p>
            </footer>
        </form>
    </main>
</body>
</html>
