<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>ログイン</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f5f5f5;
        }
        .form-signin {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            margin: auto;
        }
    </style>
</head>
<body class="text-center">
    
    <main class="form-signin">
        <form method="post">
            <h1 class="h3 mb-3 fw-normal">ログインしてください</h1>
            {% if form.errors %}
                <div class="alert alert-danger">
                    ユーザー名またはパスワードが正しくありません。
                </div>
            {% endif %}

            {% csrf_token %}

            <div class="form-floating mb-3">
                <input type="text" name="username" class="form-control" id="id_username" placeholder="ユーザー名" required>
                <label for="id_username">ユーザー名</label>
            </div>
            <div class="form-floating mb-3">
                <input type="password" name="password" class="form-control" id="id_password" placeholder="パスワード" required>
                <label for="id_password">パスワード</label>
            </div>
            
            <button class="w-100 btn btn-lg btn-primary" type="submit">ログイン</button>
            
            <p class="mt-3">
                <a href="{% url 'records:signup' %}">アカウントを作成する</a>
            </p>
            
            <p class="mt-5 mb-3 text-muted">&copy; 2025 みらい@milie_usotsuki</p>
        </form>
    </main>

</body>
</html>
